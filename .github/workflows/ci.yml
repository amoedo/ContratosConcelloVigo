name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pipeline deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e pipeline[dev]

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install site deps
        working-directory: site
        run: npm install

      - name: Run pipeline tests
        run: python -m pytest pipeline/tests -q

      - name: Run web unit tests
        working-directory: site
        run: npm run test

      - name: Run Astro checks
        working-directory: site
        run: npm run check

      - name: Build site
        working-directory: site
        run: npm run build
