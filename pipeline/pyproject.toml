[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contratos-vigo-pipeline"
version = "0.1.0"
description = "Pipeline para descargar y analizar contratos menores del Concello de Vigo"
requires-python = ">=3.11"
dependencies = [
  "rapidfuzz>=3.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
contratos-vigo = "contratos_vigo.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
